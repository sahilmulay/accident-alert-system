<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Accident Alert System</title>

<style>
  :root {
    --primary-red: #e53935;
    --dark-red: #b71c1c;
    --success-green: #2e7d32;
    --warning-amber: #ff9800;
    --glass-white: rgba(255, 255, 255, 0.95);
    --shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a; /* Dark background makes the red pop */
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: var(--primary-red);
    color: white;
    padding: 20px;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 10;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle, #333 0%, #1a1a1a 100%);
  }

  /* Big Panic Button */
  .report-btn {
    width: 200px;
    height: 200px;
    background: var(--primary-red);
    color: white;
    border-radius: 50%;
    border: 10px solid rgba(255,255,255,0.1);
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 50px rgba(229, 57, 53, 0.5);
    animation: pulse 2s infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 30px rgba(229, 57, 53, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
  }

  /* Sliding Report Box */
  .box {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--glass-white);
    border-radius: 30px 30px 0 0;
    padding: 25px;
    max-height: 85vh;
    overflow-y: auto;
    display: none;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
    z-index: 100;
  }

  .box.active {
    display: block;
    transform: translateY(0);
  }

  .drag-handle {
    width: 40px;
    height: 5px;
    background: #ccc;
    border-radius: 10px;
    margin: -10px auto 20px;
  }

  label {
    font-weight: 800;
    color: #444;
    font-size: 13px;
    text-transform: uppercase;
    margin-top: 20px;
    display: block;
  }

  /* Visual Grid for Accident Types */
  .type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
  }

  .type-card {
    background: #f0f0f0;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
    border: 2px solid transparent;
  }

  .type-card.selected {
    background: #ffebee;
    border-color: var(--primary-red);
    color: var(--primary-red);
  }

  video, canvas {
    width: 100%;
    border-radius: 15px;
    background: #000;
    margin-top: 10px;
  }

  .cam-btn {
    background: #444;
    color: white;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
    width: 100%;
    font-weight: bold;
  }

  .submit-btn {
    background: var(--success-green);
    color: white;
    padding: 18px;
    border-radius: 15px;
    font-size: 18px;
    font-weight: 800;
    border: none;
    width: 100%;
    margin-top: 25px;
    box-shadow: 0 5px 15px rgba(46, 125, 50, 0.4);
  }

  /* Success Message */
  .success-overlay {
    position: fixed;
    inset: 0;
    background: var(--success-green);
    color: white;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    text-align: center;
    padding: 20px;
  }
</style>
</head>

<body>

<header>🚑 ACCIDENT ALERT</header>

<div class="main-content">
  <div class="warning" style="color: #bbb; font-size: 12px; margin-bottom: 20px;">
    ⚠️ EMERGENCY USE ONLY
  </div>
  
  <button class="report-btn" onclick="openReport()">
    🚨<br>REPORT<br>ACCIDENT
  </button>
</div>

<div id="reportBox" class="box">
  <div class="drag-handle" onclick="closeReport()"></div>
  <h2 style="margin:0; font-size: 22px; color: #1a1a1a;">New Emergency Alert</h2>

  <label>Accident Type</label>
  <div class="type-grid">
    <div class="type-card" onclick="setType(this, 'Car')">🚗 Car</div>
    <div class="type-card" onclick="setType(this, 'Bike')">🏍️ Bike</div>
    <div class="type-card" onclick="setType(this, 'Medical')">🤕 Medical</div>
    <div class="type-card" onclick="setType(this, 'Fire')">🔥 Fire</div>
  </div>

  <label>Evidence</label>
  <button class="cam-btn" onclick="openCamera()">📷 Start Camera</button>
  <video id="video" autoplay playsinline style="display:none;"></video>
  <button id="captureBtn" class="cam-btn" style="display:none; background: var(--primary-red);" onclick="capturePhoto()">📸 Take Photo</button>
  <canvas id="canvas" style="display:none;"></canvas>

  <label>Notify Services</label>
  <div style="background: #f0f0f0; padding: 15px; border-radius: 15px; margin-top: 10px;">
    <div style="margin-bottom: 10px;"><input type="checkbox" checked disabled> 🚓 Police (Auto)</div>
    <div style="margin-bottom: 10px;"><input type="checkbox" id="ambulance"> 🚑 Ambulance</div>
    <div style="margin-bottom: 0;"><input type="checkbox" id="fire"> 🚒 Fire Brigade</div>
  </div>

  <label>Location</label>
  <input type="text" id="location" readonly style="width:100%; border:none; background:none; color: var(--success-green); font-weight: bold;" value="Fetching GPS...">

  <button class="submit-btn" onclick="submitAlert()">SUBMIT EMERGENCY ALERT</button>
</div>

<div id="successOverlay" class="success-overlay">
  <h1 style="font-size: 50px;">✅</h1>
  <h2>ALERT SENT</h2>
  <p>Emergency responders have received your GPS coordinates and photo evidence.</p>
  <button onclick="location.reload()" style="background:white; color:var(--success-green); padding:10px 20px; border:none; border-radius:10px; font-weight:bold; margin-top:20px;">BACK</button>
</div>

<script>
let stream;
let selectedType = "";

function openReport(){
  const box = document.getElementById("reportBox");
  box.style.display = "block";
  setTimeout(() => box.classList.add("active"), 10);
  getLocation();
}

function setType(el, type) {
  document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedType = type;
}

function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p => document.getElementById("location").value = `📍 ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`,
      () => document.getElementById("location").value = "Location Access Required"
    );
  }
}

function openCamera(){
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(s => {
      stream = s;
      const v = document.getElementById("video");
      v.style.display = "block";
      v.srcObject = s;
      document.getElementById("captureBtn").style.display = "block";
    });
}

function capturePhoto(){
  const v = document.getElementById("video");
  const c = document.getElementById("canvas");
  c.style.display = "block";
  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  v.style.display = "none";
  document.getElementById("captureBtn").style.display = "none";
  if(stream) stream.getTracks().forEach(t => t.stop());
}

function submitAlert(){
  if(!selectedType) { alert("Please select an accident type"); return; }
  
  document.getElementById("successOverlay").style.display = "flex";
}
</script>

</body>
</html>
