<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accident Alert System</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  margin:0;
  text-align:center;
}
header{
  background:#d32f2f;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:450px;
  margin:auto;
  padding:20px;
}
.warning{
  background:#fff3e0;
  border-left:5px solid #ff9800;
  padding:12px;
  color:#e65100;
  text-align:left;
  font-size:14px;
}
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.report-btn{background:#e53935;color:white;font-weight:bold;}
.submit-btn{background:#2e7d32;color:white;font-weight:bold;}
.box{
  display:none;
  background:white;
  padding:20px;
  margin-top:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
  text-align:left;
}
label{font-weight:bold;display:block;margin-top:15px;}
input,select{width:100%;padding:10px;margin-top:5px;}
video,canvas{width:100%;border-radius:8px;margin-top:10px;}
.loader{
  border:5px solid #eee;
  border-top:5px solid #2e7d32;
  border-radius:50%;
  width:40px;height:40px;
  animation:spin 1s linear infinite;
  margin:20px auto;
}
@keyframes spin{100%{transform:rotate(360deg);}}
.success{
  display:none;
  background:#e8f5e9;
  border:2px solid #2e7d32;
  padding:20px;
  margin-top:20px;
  border-radius:10px;
  text-align:center;
}
footer{margin-top:30px;font-size:12px;color:#777;}
</style>
</head>

<body>

<header>🚑 Accident Alert System</header>

<div class="container">

<div class="warning">
⚠️ False accident reporting is a punishable offense.
</div>

<button class="report-btn" onclick="openReport()">🚨 REPORT ACCIDENT</button>

<div id="reportBox" class="box">

<label>Camera Evidence:</label>
<button onclick="openCamera()">📷 Open Camera</button>

<video id="video" autoplay playsinline></video>
<button onclick="capturePhoto()">📸 Capture Photo</button>
<canvas id="canvas" style="display:none;"></canvas>

<label>Accident Type:</label>
<select id="type">
  <option value="">-- Select --</option>
  <option>Car Accident</option>
  <option>Bike Accident</option>
  <option>Pedestrian / Medical</option>
  <option>Fire Emergency</option>
</select>

<label>Phone Number (Optional):</label>
<input type="tel" placeholder="Optional contact number">

<label>Send Alert To:</label>
<label><input type="checkbox" checked disabled> 🚓 Police (Mandatory)</label>
<label><input type="checkbox" id="ambulance"> 🚑 Ambulance</label>
<label><input type="checkbox" id="fire"> 🚒 Fire Brigade</label>

<label>Location (Auto-detected):</label>
<input type="text" id="location" readonly>

<button class="submit-btn" onclick="submitAlert()">SUBMIT ALERT</button>

<div id="loader" class="loader" style="display:none;"></div>

</div>

<div id="success" class="success">
  <h3>✅ Alert Sent Successfully</h3>
  <p>Emergency services have been notified.</p>
</div>

<footer>School Project – Accident Alert System</footer>

</div>

<script>
let stream;

function openReport(){
  document.getElementById("reportBox").style.display="block";
  getLocation();
}

function getLocation(){
  const loc=document.getElementById("location");
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>loc.value=`Lat: ${p.coords.latitude.toFixed(4)}, Lon: ${p.coords.longitude.toFixed(4)}`,
      ()=>loc.value="Location denied"
    );
  }
}

function openCamera(){
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(s=>{
      stream=s;
      document.getElementById("video").srcObject=s;
    })
    .catch(()=>alert("Camera permission denied"));
}

function capturePhoto(){
  const video=document.getElementById("video");
  const canvas=document.getElementById("canvas");
  canvas.style.display="block";
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);
  if(stream) stream.getTracks().forEach(t=>t.stop());
}

function submitAlert(){
  const type=document.getElementById("type").value;
  const amb=document.getElementById("ambulance").checked;
  const fire=document.getElementById("fire").checked;

  if(!type){alert("Select accident type");return;}
  if(!amb && !fire){alert("Select Ambulance or Fire");return;}

  document.getElementById("loader").style.display="block";

  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
    document.getElementById("reportBox").style.display="none";
    document.getElementById("success").style.display="block";

    setTimeout(()=>{
      document.getElementById("success").style.display="none";
    },3000);

  },2000);
}
</script>

</body>
</html>
