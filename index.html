<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accident Alert System</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  margin:0;
  text-align:center;
}
header{
  background:#d32f2f;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:450px;
  margin:auto;
  padding:20px;
}
.warning{
  background:#fff3e0;
  border-left:5px solid #ff9800;
  padding:12px;
  color:#e65100;
  text-align:left;
  font-size:14px;
}
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.report-btn{
  background:#e53935;
  color:white;
  font-weight:bold;
}
.submit-btn{
  background:#2e7d32;
  color:white;
  font-weight:bold;
}
.box{
  display:none;
  background:white;
  padding:20px;
  margin-top:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
  text-align:left;
}
label{
  font-weight:bold;
  display:block;
  margin-top:15px;
}
input,select{
  width:100%;
  padding:10px;
  margin-top:5px;
}
.preview{
  margin-top:10px;
}
.preview img, .preview video{
  width:100%;
  border-radius:8px;
}
footer{
  margin-top:30px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<header>🚑 Accident Alert System</header>

<div class="container">

<div class="warning">
⚠️ False accident reporting is a punishable offense.
</div>

<button class="report-btn" onclick="openReport()">🚨 REPORT ACCIDENT</button>

<div id="reportBox" class="box">

<label>Evidence (Camera / Gallery):</label>
<input 
  type="file"
  id="evidence"
  accept="image/*,video/*"
  capture="environment"
  onchange="previewFile()"
>

<small style="color:#555">
📷 On mobile, camera opens directly. On laptop, file picker opens (browser security).
</small>

<div class="preview" id="preview"></div>

<label>Accident Type:</label>
<select id="type">
  <option value="">-- Select --</option>
  <option>Car Accident</option>
  <option>Bike Accident</option>
  <option>Pedestrian / Medical</option>
  <option>Fire Emergency</option>
</select>

<label>Phone Number (Optional):</label>
<input type="tel" placeholder="Optional contact number">

<label>Send Alert To:</label>
<label><input type="checkbox" checked disabled> 🚓 Police (Mandatory)</label>
<label><input type="checkbox" id="ambulance"> 🚑 Ambulance</label>
<label><input type="checkbox" id="fire"> 🚒 Fire Brigade</label>

<label>Location (Auto-detected):</label>
<input type="text" id="location" readonly placeholder="Fetching location...">

<button class="submit-btn" onclick="sendAlert()">SUBMIT ALERT</button>

</div>

<footer>School Project – Accident Alert System</footer>

</div>

<script>
function openReport(){
  document.getElementById("reportBox").style.display="block";
  getLocation();
}

function getLocation(){
  const loc=document.getElementById("location");
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{
        loc.value=`Lat: ${p.coords.latitude.toFixed(4)}, Lon: ${p.coords.longitude.toFixed(4)}`;
      },
      ()=>{loc.value="Location permission denied";}
    );
  }else{
    loc.value="Geolocation not supported";
  }
}

function previewFile(){
  const file=document.getElementById("evidence").files[0];
  const preview=document.getElementById("preview");
  preview.innerHTML="";
  if(!file) return;

  if(file.type.startsWith("image")){
    const img=document.createElement("img");
    img.src=URL.createObjectURL(file);
    preview.appendChild(img);
  }else if(file.type.startsWith("video")){
    const video=document.createElement("video");
    video.src=URL.createObjectURL(file);
    video.controls=true;
    preview.appendChild(video);
  }
}

function sendAlert(){
  const type=document.getElementById("type").value;
  const amb=document.getElementById("ambulance").checked;
  const fire=document.getElementById("fire").checked;

  if(!type){
    alert("Please select accident type.");
    return;
  }
  if(!amb && !fire){
    alert("Select Ambulance or Fire. Police is already included.");
    return;
  }

  alert(
    "✅ ALERT SENT\n\n" +
    "Police: YES\n" +
    "Ambulance: " + (amb?"YES":"NO") + "\n" +
    "Fire: " + (fire?"YES":"NO")
  );

  document.getElementById("reportBox").style.display="none";
}
</script>

</body>
</html>
